<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive 3D Cubes Demo</title>
    <meta name="description" content="Interactive 3D cube grid component with GSAP animations, mouse tracking, and ripple effects" />
    <style>
      /* Minimal loading styles */
      #root {
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
      }
      
      /* Loading indicator */
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.2rem;
        opacity: 0.7;
      }
      
      .loading::after {
        content: '...';
        animation: dots 1.5s infinite;
      }
      
      @keyframes dots {
        0%, 20% { content: ''; }
        40% { content: '.'; }
        60% { content: '..'; }
        80%, 100% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">Loading Interactive Cubes</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
